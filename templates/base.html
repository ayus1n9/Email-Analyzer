<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Email Header Analyzer{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <script>
        (function() {
            const theme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', theme);
        })();
    </script>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="brand">📧 Email Analyzer</a>
            <nav>
                <a href="/">Upload</a>
                <a href="/api/v1/docs">API</a>

                {% if session.get('authenticated') %}
                <form action="{{ url_for('logout') }}" method="POST" style="display:inline;">
                    <input type="hidden" name="csrf_token" value="{{ generate_csrf_token() }}">
                    <button type="submit" style="background:none;border:none;color:inherit;cursor:pointer;font-size:1rem;">
                        Logout
                    </button>
                </form>
                {% else %}
                <a href="{{ url_for('login') }}">Login</a>
                {% endif %}

                <button id="theme-toggle" style="background:none;border:none;color:inherit;cursor:pointer;font-size:1.2rem;">🌙</button>
            </nav>
        </div>
    </header>
    <main>
        {% block content %}{% endblock %}
    </main>
    <footer>
        <p>Email Header Analyzer &copy; 2026</p>
    </footer>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
    <script>
        document.getElementById('theme-toggle').addEventListener('click', function() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            const next = current === 'light' ? 'dark' : 'light';
            html.setAttribute('data-theme', next);
            localStorage.setItem('theme', next);
            this.textContent = next === 'light' ? '🌙' : '☀️';
        });
    </script>
</body>
</html>
