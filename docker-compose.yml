services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: email-analyzer:latest
    container_name: email-analyzer-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=False
      - FLASK_HOST=0.0.0.0
      - FLASK_PORT=5000
      - DATABASE_PATH=/app/data/email_analysis.db
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set}
      - WEB_ADMIN_TOKEN=${WEB_ADMIN_TOKEN:?WEB_ADMIN_TOKEN must be set}
      - VIRUSTOTAL_API_KEY=${VIRUSTOTAL_API_KEY:-}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY:-}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped
    networks:
      - email-analyzer-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  security-scanner:
    image: aquasec/trivy:latest
    container_name: email-analyzer-scanner
    command: image --severity HIGH,CRITICAL --exit-code 1 email-analyzer:latest
    depends_on:
      - app
    profiles:
      - scan

networks:
  email-analyzer-network:
    driver: bridge