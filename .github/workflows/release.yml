name: Create GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body: |
            ## Quick Start

            ### Using Docker
            ```bash
            docker build -t email-analyzer:latest .
            docker run -p 5000:5000 \
              -e FLASK_ENV=production \
              -e SECRET_KEY=<set-a-strong-secret> \
              -e WEB_ADMIN_TOKEN=<set-a-strong-admin-token> \
              email-analyzer:latest
            ```

            ### Using Python
            ```bash
            git clone https://github.com/${{ github.repository }}.git
            cd email-analyzer
            python -m venv venv
            source venv/bin/activate
            pip install -r requirements.txt
            gunicorn --bind 127.0.0.1:5000 app:app
            ```

            ## 🔒 Security Status
            | Check | Status |
            |-------|--------|
            | SAST (Bandit) | ✅ Passing |
            | SCA (Safety) | ✅ Passing |
            | Secrets Detection | ✅ Passing |
            | Container Scan | ✅ Passing |

          draft: false
          prerelease: false