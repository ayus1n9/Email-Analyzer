name: 🔒 Security Scans

on:
  push:
    branches: [ master, devsecops ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  sast:
    name: 🛡️ SAST (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Bandit
        run: pip install bandit
      
      - name: Run Bandit SAST
        id: bandit
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f html -o bandit-report.html || true
          echo "status=success" >> $GITHUB_OUTPUT
      
      - name: Check for HIGH severity issues
        run: |
          if grep -q '"issue_severity": "HIGH"' bandit-report.json; then
            echo "🔴 Security scan found HIGH severity issues!"
            cat bandit-report.json | jq '.results[] | select(.issue_severity=="HIGH")'
            exit 1
          else
            echo "✅ No HIGH severity issues found!"
          fi
      
      - name: Upload SAST Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sast-report
          path: |
            bandit-report.json
            bandit-report.html

  sca:
    name: 📦 SCA (Safety)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install dependencies
        run: |
          pip install safety
          pip freeze > requirements.txt
      
      - name: Run Safety SCA
        run: |
          safety check -r requirements.txt --json > safety-report.json || true
          safety check -r requirements.txt --full-report > safety-report.txt || true
      
      - name: Check for vulnerabilities
        run: |
          if grep -q '"vulnerabilities"' safety-report.json; then
            echo "🔴 Vulnerabilities found in dependencies!"
            cat safety-report.json | jq '.vulnerabilities'
            exit 1
          else
            echo "✅ No vulnerabilities found in dependencies!"
          fi
      
      - name: Upload SCA Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sca-report
          path: |
            safety-report.json
            safety-report.txt

  secrets:
    name: 🔑 Secrets Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Scan for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --only-verified

  security-badge:
    name: 🏷️ Security Badge
    runs-on: ubuntu-latest
    needs: [sast, sca, secrets]
    if: success() || failure()
    steps:
      - name: Determine overall status
        id: status
        run: |
          if [[ "${{ needs.sast.result }}" == "failure" || \
                "${{ needs.sca.result }}" == "failure" || \
                "${{ needs.secrets.result }}" == "failure" ]]; then
            echo "overall=failing" >> $GITHUB_OUTPUT
          else
            echo "overall=passing" >> $GITHUB_OUTPUT
          fi
      
      - name: Create Security Badge using Shields.io
        run: |
          STATUS="${{ steps.status.outputs.overall }}"
          COLOR="${{ steps.status.outputs.overall == 'passing' && 'brightgreen' || 'red' }}"
          echo "Security Scan: $STATUS"
          
          # Create a simple badge URL
          BADGE_URL="https://img.shields.io/badge/Security%20Scan-$STATUS-$COLOR"
          echo "BADGE_URL=$BADGE_URL" >> $GITHUB_ENV
      
      - name: Upload Security Badge Status
        run: |
          echo "Security Scan: ${{ steps.status.outputs.overall }}" > security-status.txt
          echo "Badge URL: $BADGE_URL" >> security-status.txt
      
      - name: Upload Security Status
        uses: actions/upload-artifact@v4
        with:
          name: security-status
          path: security-status.txt
      
      - name: Update README Badge (Optional)
        run: |
          STATUS="${{ steps.status.outputs.overall }}"
          COLOR="${{ steps.status.outputs.overall == 'passing' && 'brightgreen' || 'red' }}"
          echo "![]()" 