name: Container Security Scan

on:
  push:
    branches: [ master, devsecops ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '0 2 * * 0'  # Weekly scan on Sunday at 2 AM

jobs:
  # ============================================
  # JOB 1: Build and Scan Docker Image
  # ============================================
  container-scan:
    name: 🐳 Trivy Container Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: email-analyzer:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: email-analyzer:latest
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '1'
          ignore-unfixed: true
      
      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-results.sarif

  # ============================================
  # JOB 2: Docker Bench for Security
  # ============================================
  docker-bench:
    name: 🛡️ Docker Bench Security
    runs-on: ubuntu-latest
    
    steps:
      - name: Run Docker Bench for Security
        uses: docker://docker/docker-bench-security
        with:
          args: --output docker-bench-report.txt
      
      - name: Upload Docker Bench Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docker-bench-report
          path: docker-bench-report.txt